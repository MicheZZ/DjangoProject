{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой сайт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar из основного layout -->
            <div class="col-md-3 col-lg-2 bg-white shadow-sm p-3">
                <div class="text-center mb-4">
                    <img src="{% static 'main/img/river.jpg' %}" alt="Лого" class="rounded-circle" width="80" height="80">
                    <h4 class="mt-2">ccwwan</h4>
                </div>
                <h5 class="text-muted mb-3">Навигация</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}"><i class="fas fa-home me-2"></i>Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'games' %}"><i class="fas fa-gamepad me-2"></i>Игры</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'others' %}"><i class="fas fa-list me-2"></i>Остальное</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contacts' %}"><i class="fas fa-envelope me-2"></i>Контакты</a></li>
                </ul>
            </div>

            <!-- Main content -->
            <div class="col-md-9 col-lg-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
